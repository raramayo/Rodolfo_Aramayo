name: Site

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: mkdocs build --clean --strict
      - run: python -B scripts/check_internal_links.py site /Rodolfo_Aramayo/
      - name: Verify public resume aliases match
        run: cmp -s docs/07_Resume_Rodolfo_Aramayo.pdf docs/assets/documents/Rodolfo-Aramayo-Biotech-AI-Resume.pdf

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Git credentials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: mkdocs gh-deploy --force --clean --strict
